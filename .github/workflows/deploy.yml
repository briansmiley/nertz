# Push to `staging` -> https://nertz-staging.fly.dev ; push to `main` -> https://nertz.fly.dev .
# Both run the checks first, then deploy at once: open tables are kept on the volume and come back paused (SMI-189),
# so a deploy no longer waits for the games to end.
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# A newer push to the same branch replaces an older run.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --testTimeout=180000
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP: ${{ github.ref_name == 'main' && 'nertz' || 'nertz-staging' }}
      FLY_API_TOKEN: ${{ github.ref_name == 'main' && secrets.FLY_API_TOKEN_PROD || secrets.FLY_API_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master as of 2026-11-21
      - name: Build the image
        run: flyctl deploy --app "$APP" --remote-only --build-only --push --image-label "$GITHUB_SHA"
      - run: flyctl deploy --app "$APP" --ha=false --image "registry.fly.io/$APP:$GITHUB_SHA"
