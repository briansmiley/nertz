# Push to `staging` -> https://nertz-staging.fly.dev ; push to `main` -> https://nertz.fly.dev .
# Both run the checks first. A deploy drops every table (they live in the server's memory), so `main` waits until
# nobody is connected before it deploys; staging does not wait. The image is built before the wait, not after it: what
# follows "nobody connected" is then only the swap, not minutes of building in which a table can open.
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# A newer push to the same branch replaces an older run, including one still waiting for the tables to empty.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --testTimeout=180000
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP: ${{ github.ref_name == 'main' && 'nertz' || 'nertz-staging' }}
      FLY_API_TOKEN: ${{ github.ref_name == 'main' && secrets.FLY_API_TOKEN_PROD || secrets.FLY_API_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build the image
        run: flyctl deploy --app "$APP" --remote-only --build-only --push --image-label "$GITHUB_SHA"
      - name: Wait until nobody is connected
        if: github.ref_name == 'main'
        run: |
          # Asked every 30 seconds for up to 90 minutes. (Anyone with the page open on a table counts, playing or not.)
          for i in $(seq 1 180); do
            n=$(curl -fsS --max-time 20 "https://$APP.fly.dev/healthz" | jq -r .connections || echo unknown)
            if [ "$n" = "0" ]; then echo "Nobody connected: deploying."; exit 0; fi
            echo "$n connected; waiting."
            sleep 30
          done
          echo "Still in use after 90 minutes. Re-run this job when the tables are empty."
          exit 1
      - run: flyctl deploy --app "$APP" --ha=false --image "registry.fly.io/$APP:$GITHUB_SHA"
