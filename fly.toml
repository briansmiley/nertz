# Proposed Fly.io config (see README "Hosting plan"). Nothing has been deployed with it.
# Replace `app` with a name of your own; pick the region nearest the players.
app = "nertz"
primary_region = "sjc"

[http_service]
  internal_port = 8080
  force_https = true
  # Tables live in this process's memory: never stop it, and run exactly one (`fly scale count 1`).
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections" # websockets are long-lived; count connections, not requests
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
