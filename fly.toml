# Fly.io config for every app (see README "Hosting" and "Previews"): `nertz`, `nertz-staging` (.github/workflows/deploy.yml)
# and the PR previews `nertz-pr-<number>` (.github/workflows/preview.yml), each named with --app.
app = "nertz"
primary_region = "sjc"
# Stopped (a deploy), the server pauses every round, tells the windows, and writes the open tables to /data
# (server/index.ts, `update`), then exits by itself within a second. This is how long it is given before it is killed.
kill_timeout = "15s"

[http_service]
  internal_port = 8080
  force_https = true
  # Tables live in this process's memory. Fly only suspends a machine with no open connections, and every player at a
  # table holds a websocket, so games in progress keep it up; an idle machine is suspended (memory kept) and resumed
  # on the next request. Run exactly one machine (`fly scale count 1`).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections" # websockets are long-lived; count connections, not requests
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

# What has to outlive a deploy: the accounts and the open tables (server/db.ts keeps them in /data/nertz.db). One volume of this name
# per app, made once before the first deploy that mounts it: `fly volumes create nertz_data --size 1 -r sjc -a <app>`.
[mounts]
  source = "nertz_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
