# Proposed Fly.io config (see README "Hosting plan"). Nothing has been deployed with it.
# Replace `app` with a name of your own; pick the region nearest the players.
app = "nertz"
primary_region = "sjc"

[http_service]
  internal_port = 8080
  force_https = true
  # Tables live in this process's memory. Fly only suspends a machine with no open connections, and every player at a
  # table holds a websocket, so games in progress keep it up; an idle machine is suspended (memory kept) and resumed
  # on the next request. Run exactly one machine (`fly scale count 1`).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections" # websockets are long-lived; count connections, not requests
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
