<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123a43" />
    <!-- Added to a phone's home screen, the game opens by itself: no address bar, the whole screen. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nertz" />
    <link rel="apple-touch-icon" id="touch-icon" href="/icon-180.png?v=2" />
    <title>Nertz</title>
    <link rel="icon" id="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='2' width='20' height='28' rx='3' fill='%23fffdf7'/%3E%3Cpath d='M16 8c3 4 8 6 8 10 0 4-5 4-7 2 0 2 1 3 2 4h-6c1-1 2-2 2-4-2 2-7 2-7-2 0-4 5-6 8-10z' fill='%231a1c23'/%3E%3C/svg%3E" />
    <script>
      // Anywhere but production (its own domain, or its fly.dev name), so on staging, a PR's preview or localhost, the card carries an orange wrench, and its tab is told apart.
      if (!['nertz.binarysmile.com', 'nertz.fly.dev'].includes(location.hostname)) {
        // (iPhone browsers show the touch icon in their tabs, so it carries the wrench too.)
        document.getElementById('touch-icon').href = '/icon-180-dev.png?v=2';
        document.getElementById('icon').href =
          'data:image/svg+xml,' +
          encodeURIComponent(
            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='2' width='20' height='28' rx='3' fill='#fffdf7'/><path d='M16 8c3 4 8 6 8 10 0 4-5 4-7 2 0 2 1 3 2 4h-6c1-1 2-2 2-4-2 2-7 2-7-2 0-4 5-6 8-10z' fill='#1a1c23'/><circle cx='24' cy='25' r='7' fill='#e8812a'/><g transform='translate(15.2 16.4) scale(0.55)'><path d='M10.5 24.5 L19 16' stroke='#fffdf7' stroke-width='3.2' stroke-linecap='round'/><circle cx='21.5' cy='13.5' r='4.6' fill='#fffdf7'/><path d='M21.5 13.5 L26.5 8.5' stroke='#e8812a' stroke-width='3.4'/></g></svg>",
          );
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Bowlby+One&family=Fredoka:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
